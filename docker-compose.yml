version: '3.8'

services:
  familycalendar:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: reverse proxy + automatic Let's Encrypt cert via Cloudflare
  # DNS-01 (no public port-forwarding required). See README for setup.
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - familycalendar
    restart: unless-stopped
    profiles:
      - production

volumes:
  caddy_data:
  caddy_config:
